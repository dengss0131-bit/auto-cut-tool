<div class="page">
  <header>
    <div>
      <p class="eyebrow">Auto Cut MVP</p>
      <h1>口播自动粗剪工具</h1>
      <p class="subtitle">自动检测长停顿，把机械剪切交给程序。第一版适合先做口播粗剪，再导入剪映精修。</p>
    </div>
  </header>

  <main class="grid">
    <section class="card form-card">
      <h2>输入视频</h2>
      <label>
        点击选择视频文件
        <input id="video" type="file" accept="video/*,.mp4,.mov,.mkv,.avi,.m4v" />
      </label>
      <div id="fileInfo" class="file-info">还没有选择视频</div>

      <label>
        剪辑模式
        <select id="mode">
          <option value="natural">自然：少剪一点</option>
          <option value="standard" selected>标准：推荐默认</option>
          <option value="tight">紧凑：剪得更狠</option>
        </select>
      </label>

      <div class="params">
        <label>
          最短停顿秒数
          <input id="min_silence" type="number" step="0.01" placeholder="默认随模式" />
        </label>
        <label>
          保留停顿秒数
          <input id="keep_silence" type="number" step="0.01" placeholder="默认随模式" />
        </label>
        <label>
          静音阈值 dB
          <input id="threshold_db" type="number" step="1" placeholder="例如 -35" />
        </label>
        <label>
          字头字尾保护秒数
          <input id="padding" type="number" step="0.01" placeholder="默认随模式" />
        </label>
      </div>

      <button id="run">生成剪后预览</button>
      <p class="hint">提示：如果背景噪声大，尝试把静音阈值调高，如 -32；如果剪太狠，使用自然模式。</p>
    </section>

    <section class="card result-card">
      <h2>剪辑结果</h2>
      <div id="status" class="status idle">等待开始</div>
      <div id="summaryBox" class="summary-grid hidden"></div>
      <div id="previewBox" class="preview-box hidden">
        <h3>剪后预览</h3>
        <video id="previewVideo" controls playsinline></video>
        <label>
          导出文件名
          <input id="exportName" placeholder="例如：talk_final.mp4" />
        </label>
        <button id="speechBtn" class="ghost" disabled>分析口播瑕疵</button>
        <button id="exportBtn" class="secondary" disabled>确认并导出</button>
      </div>
      <div id="cutListBox" class="cut-list-box hidden">
        <div class="cut-list-head">
          <h3>删除片段列表</h3>
          <span id="cutListCount"></span>
        </div>
        <div id="cutList" class="cut-list"></div>
      </div>
      <div id="speechBox" class="speech-box hidden">
        <div class="cut-list-head">
          <h3>疑似口播瑕疵</h3>
          <span id="fillerCount"></span>
        </div>
        <div id="fillerList" class="cut-list"></div>
        <h3 class="transcript-title">全文转写</h3>
        <div id="transcriptList" class="transcript-list"></div>
        <div id="srtPath" class="srt-path"></div>
      </div>
      <pre id="result">这里会显示预览文件、节省时长和剪辑报告。确认满意后再导出最终视频。</pre>
    </section>
  </main>
</div>

<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #667085;
    --line: #e4e7ec;
    --brand: #3457ff;
    --brand-dark: #263fd6;
    --ok-bg: #ecfdf3;
    --ok: #027a48;
    --err-bg: #fef3f2;
    --err: #b42318;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at top left, #e9edff, var(--bg) 38%);
    color: var(--text);
  }
  .page { max-width: 1120px; margin: 0 auto; padding: 48px 24px; }
  header { margin-bottom: 28px; }
  .eyebrow { margin: 0 0 8px; color: var(--brand); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 42px; line-height: 1.1; }
  .subtitle { max-width: 720px; color: var(--muted); font-size: 17px; line-height: 1.7; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  .card { background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 22px; padding: 24px; box-shadow: 0 20px 60px rgba(31, 41, 55, .08); }
  h2 { margin: 0 0 18px; font-size: 22px; }
  label { display: block; color: #344054; font-weight: 650; margin: 16px 0 6px; }
  input, select {
    width: 100%; margin-top: 8px; border: 1px solid #d0d5dd; border-radius: 12px;
    padding: 13px 14px; font-size: 15px; color: var(--text); background: #fff;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(52,87,255,.12); }
  .params { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  button {
    width: 100%; margin-top: 22px; border: none; border-radius: 14px; padding: 15px 18px;
    background: var(--brand); color: white; font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: 0 12px 28px rgba(52,87,255,.22);
  }
  button:hover { background: var(--brand-dark); }
  button.secondary { background: #172033; box-shadow: 0 12px 28px rgba(23,32,51,.16); }
  button.secondary:hover { background: #344054; }
  button.ghost { background: #eef2ff; color: var(--brand); box-shadow: none; }
  button.ghost:hover { background: #dfe6ff; }
  button:disabled { opacity: .65; cursor: not-allowed; }
  .hint { color: var(--muted); line-height: 1.7; font-size: 14px; }
  .file-info { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #f8fafc; border: 1px dashed #d0d5dd; color: var(--muted); font-size: 14px; }
  .status { display: inline-flex; padding: 8px 12px; border-radius: 999px; font-weight: 800; margin-bottom: 14px; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 0 0 16px; }
  .summary-item { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: #f8fafc; }
  .summary-label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .summary-value { font-size: 22px; font-weight: 900; color: var(--text); }
  .preview-box { margin: 4px 0 16px; padding: 14px; background: #f8fafc; border: 1px solid var(--line); border-radius: 16px; }
  .preview-box h3 { margin: 0 0 12px; font-size: 18px; }
  .preview-box video { width: 100%; max-height: 360px; background: #000; border-radius: 12px; }
  .cut-list-box { margin: 0 0 16px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .cut-list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .cut-list-head h3 { margin: 0; font-size: 18px; }
  .cut-list-head span { color: var(--muted); font-size: 13px; }
  .cut-list { max-height: 280px; overflow: auto; display: grid; gap: 8px; padding-right: 4px; }
  .cut-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid #edf0f5; border-radius: 12px; background: #f8fafc; }
  .cut-main { font-weight: 800; color: var(--text); }
  .cut-sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
  .cut-jump { width: auto; margin: 0; padding: 8px 10px; border-radius: 10px; font-size: 13px; box-shadow: none; background: #eef2ff; color: var(--brand); }
  .cut-jump:hover { background: #dfe6ff; }
  .speech-box { margin: 0 0 16px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .transcript-title { margin: 18px 0 10px; font-size: 18px; }
  .transcript-list { max-height: 320px; overflow: auto; display: grid; gap: 8px; }
  .transcript-row { padding: 10px 12px; border: 1px solid #edf0f5; border-radius: 12px; background: #f8fafc; }
  .transcript-time { color: var(--brand); font-size: 13px; font-weight: 800; margin-bottom: 5px; }
  .transcript-text { color: var(--text); line-height: 1.6; }
  .srt-path { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #ecfdf3; color: #027a48; word-break: break-all; font-weight: 700; }
  .hidden { display: none; }
  .idle { background: #f2f4f7; color: #475467; }
  .running { background: #eff4ff; color: #3457ff; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .err { background: var(--err-bg); color: var(--err); }
  pre {
    white-space: pre-wrap; word-break: break-word; min-height: 360px; margin: 0; padding: 16px;
    background: #f8fafc; border: 1px solid var(--line); border-radius: 16px; color: #182230; line-height: 1.6;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 34px; } }
</style>

<script>
  const $ = (id) => document.getElementById(id);
  const runBtn = $("run");
  const statusEl = $("status");
  const resultEl = $("result");
  const videoInput = $("video");
  const fileInfo = $("fileInfo");
  const summaryBox = $("summaryBox");
  const previewBox = $("previewBox");
  const previewVideo = $("previewVideo");
  const exportName = $("exportName");
  const speechBtn = $("speechBtn");
  const exportBtn = $("exportBtn");
  const cutListBox = $("cutListBox");
  const cutList = $("cutList");
  const cutListCount = $("cutListCount");
  const speechBox = $("speechBox");
  const fillerList = $("fillerList");
  const fillerCount = $("fillerCount");
  const transcriptList = $("transcriptList");
  const srtPath = $("srtPath");
  let currentPreviewFile = null;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status " + cls;
  }

  function numOrNull(id) {
    const value = $(id).value.trim();
    return value === "" ? null : Number(value);
  }

  function fmtTime(seconds) {
    seconds = Math.max(0, Number(seconds) || 0);
    const m = Math.floor(seconds / 60);
    const s = seconds - m * 60;
    return String(m).padStart(2, "0") + ":" + s.toFixed(2).padStart(5, "0");
  }

  function summaryItem(label, value) {
    return '<div class="summary-item"><div class="summary-label">' + label + '</div><div class="summary-value">' + value + '</div></div>';
  }

  function renderSummary(r) {
    summaryBox.innerHTML = [
      summaryItem("原始时长", fmtTime(r.original_duration)),
      summaryItem("预览时长", fmtTime(r.estimated_output_duration)),
      summaryItem("删除时长", fmtTime(r.removed_duration)),
      summaryItem("压缩比例", Math.round(r.compression_ratio * 100) + "%"),
      summaryItem("删除片段", (r.removed_segments || []).length + " 段"),
      summaryItem("剪辑模式", r.params && r.params.mode ? r.params.mode : "standard")
    ].join("");
    summaryBox.classList.remove("hidden");
  }

  function renderCutList(r) {
    const segments = r.removed_segments || [];
    cutListCount.textContent = segments.length + " 段";
    cutList.innerHTML = segments.length ? segments.map((seg, index) => {
      const duration = Math.max(0, seg.end - seg.start);
      return '<div class="cut-row">'
        + '<div><div class="cut-main">#' + (index + 1) + ' ' + fmtTime(seg.start) + ' - ' + fmtTime(seg.end) + '</div>'
        + '<div class="cut-sub">删除 ' + duration.toFixed(2) + ' 秒</div></div>'
        + '<button class="cut-jump" data-time="' + Math.max(0, seg.start - 2).toFixed(3) + '">播放附近</button>'
        + '</div>';
    }).join("") : '<div class="cut-row"><div><div class="cut-main">没有检测到需要删除的长停顿</div><div class="cut-sub">可以调高静音阈值或使用紧凑模式再试。</div></div></div>';
    cutListBox.classList.remove("hidden");
  }

  function renderSpeechResult(result) {
    const fillers = result.fillers || [];
    const segments = result.segments || [];
    fillerCount.textContent = fillers.length + " 条";
    fillerList.innerHTML = fillers.length ? fillers.map((item, index) => {
      return '<div class="cut-row">'
        + '<div><div class="cut-main">#' + (index + 1) + ' ' + fmtTime(item.start) + ' “' + item.text + '”</div>'
        + '<div class="cut-sub">来源：' + (item.source_text || '') + '</div></div>'
        + '<button class="cut-jump" data-time="' + Math.max(0, item.start - 2).toFixed(3) + '">播放附近</button>'
        + '</div>';
    }).join("") : '<div class="cut-row"><div><div class="cut-main">没有检测到明显填充词</div><div class="cut-sub">可以继续人工检查全文转写。</div></div></div>';

    transcriptList.innerHTML = segments.length ? segments.map((seg) => {
      return '<div class="transcript-row"><div class="transcript-time">' + fmtTime(seg.start) + ' - ' + fmtTime(seg.end) + '</div>'
        + '<div class="transcript-text">' + seg.text + '</div></div>';
    }).join("") : '<div class="transcript-row"><div class="transcript-text">没有生成转写内容。</div></div>';

    srtPath.textContent = result.srt ? '字幕文件：' + result.srt : '未生成字幕文件';
    speechBox.classList.remove("hidden");
  }

  cutList.addEventListener("click", (event) => {
    const btn = event.target.closest(".cut-jump");
    if (!btn) return;
    previewVideo.currentTime = Number(btn.dataset.time || 0);
    previewVideo.play().catch(() => {});
  });

  fillerList.addEventListener("click", (event) => {
    const btn = event.target.closest(".cut-jump");
    if (!btn) return;
    previewVideo.currentTime = Number(btn.dataset.time || 0);
    previewVideo.play().catch(() => {});
  });

  videoInput.addEventListener("change", () => {
    const file = videoInput.files && videoInput.files[0];
    if (!file) {
      fileInfo.textContent = "还没有选择视频";
      return;
    }
    fileInfo.textContent = "已选择：" + file.name + "（" + (file.size / 1024 / 1024).toFixed(1) + " MB）";
    runBtn.textContent = "生成剪后预览";
  });

  runBtn.addEventListener("click", async () => {
    const file = videoInput.files && videoInput.files[0];
    if (!file) {
      setStatus("缺少视频文件", "err");
      resultEl.textContent = "请先点击上方按钮选择一个视频文件。";
      return;
    }

    runBtn.disabled = true;
    speechBtn.disabled = true;
    exportBtn.disabled = true;
    currentPreviewFile = null;
    summaryBox.classList.add("hidden");
    cutListBox.classList.add("hidden");
    speechBox.classList.add("hidden");
    previewBox.classList.add("hidden");
    previewVideo.removeAttribute("src");
    setStatus("正在生成剪后预览，请稍等", "running");
    resultEl.textContent = "视频会先上传到本地工具目录，再由 ffmpeg 检测停顿并生成预览视频。长视频可能需要几分钟。";

    try {
      const payload = new FormData();
      payload.append("video", file);
      payload.append("mode", $("mode").value);
      for (const key of ["min_silence", "keep_silence", "threshold_db", "padding"]) {
        const value = $(key).value.trim();
        if (value !== "") payload.append(key, value);
      }
      const res = await fetch("/api/autocut", {
        method: "POST",
        body: payload,
        cache: "no-store"
      });
      let data;
      try {
        data = await res.json();
      } catch (jsonErr) {
        throw new Error("服务端没有返回有效结果。请确认 app/server.py 正在运行，并且当前页面是 http://127.0.0.1:8787 打开的，不要直接打开本地 HTML 预览。");
      }
      if (!res.ok || !data.ok) throw new Error(data.error || "处理失败");
      const r = data.report;
      currentPreviewFile = r.preview_file;
      previewVideo.src = r.preview_url + "?t=" + Date.now();
      previewVideo.load();
      exportName.value = r.export_suggested_name || "autocut_final.mp4";
      renderSummary(r);
      renderCutList(r);
      previewBox.classList.remove("hidden");
      speechBtn.disabled = false;
      exportBtn.disabled = false;
      runBtn.textContent = "重新生成预览";
      setStatus("预览已生成，确认满意后再导出", "ok");
      resultEl.textContent = [
        "已上传源文件：" + r.uploaded_source,
        "预览视频：" + r.preview_file,
        "预览报告：" + r.report,
        "原始时长：" + fmtTime(r.original_duration),
        "预计输出：" + fmtTime(r.estimated_output_duration),
        "删除时长：" + fmtTime(r.removed_duration),
        "压缩比例：" + Math.round(r.compression_ratio * 100) + "%",
        "删除片段数：" + r.removed_segments.length,
        "",
        JSON.stringify(r.params, null, 2)
      ].join("\n");
    } catch (err) {
      setStatus("失败", "err");
      const message = String(err.message || err);
      resultEl.textContent = message === "Failed to fetch"
        ? "无法连接到本地处理服务。请先在 auto-cut-tool 目录运行：python app/server.py，然后用 http://127.0.0.1:8787 打开页面。不要使用预览面板里的 static-html 地址。"
        : message;
    } finally {
      runBtn.disabled = false;
    }
  });

  speechBtn.addEventListener("click", async () => {
    if (!currentPreviewFile) {
      setStatus("缺少预览视频", "err");
      resultEl.textContent = "请先生成剪后预览，再分析口播瑕疵。";
      return;
    }
    speechBtn.disabled = true;
    setStatus("正在分析口播瑕疵", "running");
    resultEl.textContent = resultEl.textContent + "\n\n正在调用语音识别，首次运行可能需要下载模型，请稍等。";
    try {
      const res = await fetch("/api/analyze-speech", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          preview_file: currentPreviewFile,
          model: "base"
        })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "分析失败");
      renderSpeechResult(data.result);
      setStatus("口播瑕疵分析完成", "ok");
      resultEl.textContent = resultEl.textContent + "\n\n口播瑕疵：" + (data.result.fillers || []).length + " 条\n字幕文件：" + data.result.srt;
    } catch (err) {
      setStatus("口播分析失败", "err");
      resultEl.textContent = String(err.message || err);
    } finally {
      speechBtn.disabled = false;
    }
  });

  exportBtn.addEventListener("click", async () => {
    if (!currentPreviewFile) {
      setStatus("缺少预览视频", "err");
      resultEl.textContent = "请先生成剪后预览，再确认导出。";
      return;
    }
    exportBtn.disabled = true;
    setStatus("正在导出最终视频", "running");
    try {
      const res = await fetch("/api/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          preview_file: currentPreviewFile,
          filename: exportName.value.trim()
        })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "导出失败");
      setStatus("最终视频已导出", "ok");
      resultEl.textContent = resultEl.textContent + "\n\n最终导出视频：" + data.output + "\n最终报告：" + (data.report || "无");
    } catch (err) {
      setStatus("导出失败", "err");
      resultEl.textContent = String(err.message || err);
    } finally {
      exportBtn.disabled = false;
    }
  });
</script>
